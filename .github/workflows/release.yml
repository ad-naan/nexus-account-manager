name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.PACKAGE_VERSION}`,
              name: `Nexus Account Manager v${process.env.PACKAGE_VERSION}`,
              body: `## 📦 下载说明 / Download Guide

            ### Windows
            - **Windows 10/11 (64-bit)**: 下载 \`.msi\` 或 \`.exe\` 文件
              - \`Nexus-Account-Manager_${process.env.PACKAGE_VERSION}_x64_en-US.msi\` - MSI 安装包（推荐）
              - \`Nexus-Account-Manager_${process.env.PACKAGE_VERSION}_x64-setup.exe\` - EXE 安装包

            ### macOS
            - **Apple Silicon (M1/M2/M3)**: 下载 \`aarch64\` 版本
              - \`Nexus-Account-Manager_${process.env.PACKAGE_VERSION}_aarch64.dmg\`
            - **Intel 芯片**: 下载 \`x64\` 版本
              - \`Nexus-Account-Manager_${process.env.PACKAGE_VERSION}_x64.dmg\`

            ### Linux
            - **Debian/Ubuntu**: 下载 \`.deb\` 文件
              - \`nexus-account-manager_${process.env.PACKAGE_VERSION}_amd64.deb\`
            - **其他发行版**: 下载 \`.AppImage\` 文件
              - \`nexus-account-manager_${process.env.PACKAGE_VERSION}_amd64.AppImage\`

            ---

            ## 🔍 如何确定你的系统架构？

            ### macOS
            打开终端运行：
            \`\`\`bash
            uname -m
            \`\`\`
            - 输出 \`arm64\` → 下载 aarch64 版本
            - 输出 \`x86_64\` → 下载 x64 版本

            ### Windows
            - 设置 → 系统 → 关于 → 系统类型
            - 显示 "基于 x64 的处理器" → 下载 x64 版本

            ### Linux
            终端运行：
            \`\`\`bash
            uname -m
            \`\`\`
            - 输出 \`x86_64\` → 下载 amd64 版本

            ---

            ## 📝 更新日志

            查看完整更新日志请访问 [CHANGELOG.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md)`,
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          tauriScript: npm run tauri

